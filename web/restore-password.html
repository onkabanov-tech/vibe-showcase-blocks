<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Восстановление пароля</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">Кабанов Олег</a>
  <a class="back-link" href="index.html">← На главную</a>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Восстановление пароля</h1>
    <p class="subtitle">Укажите email, привязанный к аккаунту</p>

    <!--
      ВАЖНО: у сервера нет эндпоинта для восстановления пароля —
      ни /reset, ни /forgot, ни какого-либо аналога (проверено по всему
      server/src/routes/). По вашему решению эта форма верстается
      только визуально, без реальной отправки — ниже честно показано
      сообщение об этом, форма никуда не стучится.
    -->

    <form id="restore-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" />
        <div class="field-error" id="email-error"></div>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Отправить</button>
    </form>

    <div class="notice">
      Эта форма пока не подключена к серверу — восстановление пароля ещё не реализовано.
    </div>

    <div class="auth-links">
      <a href="login.html">← Вернуться ко входу</a>
    </div>
  </div>
</div>

<script type="module">
  // Никаких обращений к api.js здесь нет намеренно — подключать форму
  // не к чему, эндпоинта для восстановления пароля в API не существует.

  const form = document.getElementById("restore-form");
  const emailInput = document.getElementById("email");
  const emailError = document.getElementById("email-error");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    emailInput.classList.remove("invalid");
    emailError.textContent = "";

    const email = emailInput.value.trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      emailInput.classList.add("invalid");
      emailError.textContent = "Введите корректный email";
      return;
    }

    // Дальше намеренно ничего не происходит — см. примечание выше
    // и постоянную заметку под формой.
  });
</script>

</body>
</html>
